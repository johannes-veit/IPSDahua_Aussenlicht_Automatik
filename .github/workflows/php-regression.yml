name: PHP module regression checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Syntax check
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Module regression tests
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/test_*.php; do
            echo "::group::$test"
            php "$test"
            echo "::endgroup::"
          done
